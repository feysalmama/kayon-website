services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kayon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kayon}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER:-kayon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kayon}?sslmode=disable
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_HERO_VIDEO: ${NEXT_PUBLIC_HERO_VIDEO:-}
      NEXT_PUBLIC_PRINTER_VIDEO: ${NEXT_PUBLIC_PRINTER_VIDEO:-}
      NEXT_PUBLIC_VISITOR_VIDEO: ${NEXT_PUBLIC_VISITOR_VIDEO:-}
      NEXT_PUBLIC_IDENTITY_VIDEO: ${NEXT_PUBLIC_IDENTITY_VIDEO:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data/uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  postgres-data:
